name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each example resolves its "@samstarling/cloudflare-utils-*" dependency through a live
      # workspace symlink into packages/, so that package's dist/ must exist before the example's
      # typecheck can resolve the import. The root "typecheck" script runs "build" first (see
      # package.json), so this ordering is enforced by the script dependency, not by hoping these
      # steps stay in order.
      - name: Typecheck (builds the packages first, then packages + examples)
        run: bun run typecheck

      - name: Test packages
        run: bun run test

      - name: Build examples
        run: bun run build:examples
